openapi: 3.0.3
info:
  title: API ¿A Quién Llamo?
  version: 1.0.0
  description: >
    API destinada a la gestión de usuarios, técnicos, presupuestos y servicios.
    El sistema permite que una persona pueda actuar como cliente o prestador
    según la necesidad del momento.
  contact: {}
servers:
  - url: 'http://localhost:8080'
    description: SERVER LOCAL
tags:
  - name: Usuario
    description: >-
      Incluye la gestión del perfil del usuario: la creación de su perfil, la
      visualización del mismo, la visualización de otros usuarios, la
      amonestación, la baja de perfil, la "rehabilitación" (si así se quiere)
      del perfil, es decir: quitar la suspensión y quitar la baja, entre otros.
  - name: Presupuestos
    description: >-
      Gestión de presupuestos entre usuarios y técnicos, una vez que se
      establece una conversación, el prestador/técnico puede iniciar un
      presupuesto. Dentro de este, se gestionan los presupuestos como tal, la
      visualización de los mismos y el estado (pendiente, aprobado, rechazado,
      cancelado). 

      También se tomaron "medidas de seguridad" (validaciones) para evitar que,
      por ejemplo, un método aprobado pueda rechazarse de repente.
  - name: Certificación
    description: >-
      Permite cargar al técnico sus títulos (crear), al administrador le permite
      otras opciones tales como: filtrar, aprobar, rechazar, eliminar,
      actualizar.
  - name: Técnico
    description: >-
      Gestiona el registro, consulta, búsqueda, actualización y eliminación de
      prestadores de servicios dentro de la plataforma. Un técnico puede
      registrarse desde una cuenta de usuario existente o crearse directamente
      junto con sus datos personales. Además, permite filtrar técnicos por
      distintos criterios para facilitar la búsqueda de profesionales.
  - name: Especialidad
    description: >
      Permite crear, consultar, modificar y eliminar especialidades dentro de la
      plataforma. Las especialidades representan las áreas de trabajo en las que
      un técnico se desempeña, y pueden requerir distintos tipos de validación:
      por certificado, por portafolio o sin validación. Son utilizadas tanto
      para clasificar a los técnicos como para facilitar la búsqueda por parte
      de los usuarios.
  - name: Habilidad
    description: >-
      Permite crear, consultar, modificar y eliminar habilidades dentro de la
      plataforma. Las habilidades son competencias específicas que los técnicos
      pueden tener asociadas a su perfil, y que los usuarios pueden utilizar
      como criterio de búsqueda para encontrar el profesional más adecuado a su
      necesidad.
  - name: Denuncia
    description: >-
      Se manejan comportamientos inadecuados, reseñas falsas y otro tipo de
      denuncias, todas administradas por el administrador del sistema, quien
      gestiona la: aprobación, rechazo, eliminación de reseñas, filtrado, etc.
  - name: Característica
    description: >-
      Permite crear, consultar, modificar, eliminar y buscar características
      utilizadas dentro de la plataforma para clasificar o describir servicios
      ofrecidos por los prestadores.
  - name: Mensaje
    description: >-
      Gestión de mensajes dentro de un chat entre usuario y técnico. Permite
      enviar mensajes de texto, archivos adjuntos (imágenes, documentos) o ambos
      en simultáneo. Cada mensaje queda asociado a un chat y a un sender
      identificado por UUID, con timestamp automático generado en la
      persistencia. Expone endpoints para crear, modificar y listar mensajes.
  - name: Chat
    description: >-
      Gestión de conversaciones entre un usuario y un técnico. Un chat vincula a
      ambas partes y actúa como contenedor de mensajes y presupuestos. Cada
      instancia se identifica con un UUID generado automáticamente al
      persistirse. Expone endpoints para iniciar un chat, buscarlo por UUID y
      listar todos los chats de un usuario o de un técnico.
  - name: Ubicación
    description: >-
      Gestión de direcciones asociadas a un usuario. Almacena provincia, ciudad,
      calle, número, piso y código postal. Un usuario puede tener múltiples
      ubicaciones registradas, cada una identificada por UUID único. Expone
      endpoints para crear, consultar por UUID, listar por usuario, actualizar y
      eliminar una ubicación.
  - name: Administrador
    description: >-
      Gestión de cuentas de administrador del sistema. Permite registrar nuevos
      administradores y autenticarlos mediante nombre de usuario y clave
      encriptada con BCrypt. Cada administrador se identifica con un UUID
      generado automáticamente. Expone endpoints de registro y login.
  - name: Trabajos
    description: >-
      Gestión de órdenes de trabajo entre usuarios y técnicos. Permite crear un
      trabajo asignando un cliente y un técnico, consultar trabajos por UUID,
      listar todos los trabajos o filtrarlos por estado (PENDIENTE, EN_PROCESO,
      FINALIZADO, CANCELADO). También permite actualizar el estado de un trabajo
      mediante PATCH. Se pueden listar los trabajos asociados a un cliente o a
      un técnico específico mediante su UUID.
  - name: Pagos
    description: >-
      Gestión de pagos realizados por los clientes hacia los técnicos una vez
      finalizado un trabajo. Permite registrar un nuevo pago indicando el
      trabajo, el monto y el método de pago (EFECTIVO, TRANSFERENCIA,
      TARJETA_CREDITO, TARJETA_DEBITO). Expone endpoints para listar todos los
      pagos, filtrarlos por estado (PENDIENTE, APROBADO, RECHAZADO, CANCELADO) o
      por método de pago, consultar los pagos de un cliente o técnico
      específico, y cancelar un pago existente.
  - name: Rubros
    description: >-
      Mantenimiento del catálogo de rubros comerciales disponibles en la
      plataforma. Permite listar todos los rubros disponibles para usuarios
      autenticados, crear nuevos rubros y modificar los existentes. Las
      operaciones de creación y modificación están restringidas al rol
      ADMINISTRADOR. Cada rubro se identifica con un UUID generado
      automáticamente.
  - name: Rating
    description: >-
      Sistema de calificación y reseñas entre usuarios y técnicos. Permite a un
      usuario dejar una calificación con puntaje de estrellas y comentario sobre
      un trabajo finalizado, con la restricción de una sola reseña por trabajo.
      Expone endpoints para crear una nueva reseña, consultar todas las reseñas
      enviadas por un usuario específico y todas las reseñas recibidas por un
      usuario o técnico, filtrando por UUID.
  - name: Portfolio
    description: >-
      Gestión del portafolio de trabajos previos del técnico. Permite cargar
      archivos o imágenes que respalden experiencia laboral, modificar su título
      o descripción, eliminar elementos y visualizar el portafolio propio. Los
      elementos cargados pasan por un proceso de moderación donde el
      administrador puede aprobarlos o rechazarlos con un motivo. El estado de
      moderación puede ser PENDIENTE, APROBADO o RECHAZADO.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UsuarioUpdateRequest:
      type: object
      properties:
        nombre:
          type: string
        apellido:
          type: string
        email:
          type: string
        telefono:
          type: string
        sobreMi:
          type: string
        foto:
          type: string
          format: binary
    DeleteUsuarioRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
    PresupuestoRequest:
      type: object
      required:
        - precioEstimado
        - descripcionPresupuesto
      properties:
        precioEstimado:
          type: number
          format: double
        descripcionPresupuesto:
          type: string
    PresupuestoResponse:
      type: object
      properties:
        uuid:
          type: string
        nombreTecnico:
          type: string
        apellidoTecnico:
          type: string
        nombreUsuario:
          type: string
        apellidoUsuario:
          type: string
        precioEstimado:
          type: number
        descripcionPresupuesto:
          type: string
        fechaRealizado:
          type: string
          format: date-time
        estado:
          type: string
          enum:
            - PENDIENTE
            - ACEPTADO
            - RECHAZADO
            - CANCELADO
    TecnicoDTOResponse:
      type: object
    TecnicoDTORequest:
      type: object
    UsuarioDTOResponse:
      type: object
      properties:
        uuid:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        email:
          type: string
        telefono:
          type: string
        sobreMi:
          type: string
        fotoBase64:
          type: string
        tipoImagen:
          type: string
        tipoUsuario:
          type: string
        fechaRegistro:
          type: string
          format: date-time
        ultimaActividad:
          type: string
          format: date-time
    UsuarioDTORequest:
      type: object
    EspecialiadCreadaDTOResponse:
      type: object
    EspecialidadDTOResponse:
      type: object
    EspecialidadDTORequest:
      type: object
    HabilidadDTOResponse:
      type: object
    HabilidadCreadaDTOResponse:
      type: object
    HabilidadDTORequest:
      type: object
    CaracteristicaDTOResponse:
      type: object
    CaracteristicaDTORequest:
      type: object
    DenunciaDTOResponse:
      type: object
    DenunciaDTORequest:
      type: object
    PagoDTORequest:
      type: object
    PagoDTOResponse:
      type: object
    PortfolioAdminDTORequest:
      type: object
    PortfolioUsuarioDTORequest:
      type: object
    PortfolioAdminDTOResponse:
      type: object
    PortfolioUsuarioDTOResponse:
      type: object
    RatingDTORequest:
      type: object
    RatingDTOResponse:
      type: object
    RubroDTORequest:
      type: object
    RubroDTOResponse:
      type: object
    TrabajoDTORequest:
      type: object
    TrabajoDTOResponse:
      type: object
    AdministradorDTORequest:
      type: object
    AdministradorDTOResponse:
      type: object
    ChatDTORequest:
      type: object
    ChatDTOResponse:
      type: object
    MensajeDTORequest:
      type: object
    MensajeDTOResponse:
      type: object
    UbicacionDTORequest:
      type: object
    UbicacionDTOResponse:
      type: object
    CertificacionDTOResponse:
      type: object
    CertificacionDTORequest:
      type: object
  links: {}
  callbacks: {}
security:
  - bearerAuth: []
paths:
  '/aquienllamo/tecnicos/registrar/{uuidUsuario}':
    post:
      summary: Registrar una cuenta de usuario existente como técnico.
      description: ''
      parameters: []
      operationId: ''
      responses:
        default:
          description: Default response
      tags:
        - Usuario
  ' /aquienllamo/tecnicos/registrar-nuevo':
    post:
      summary: Registrar un nuevo técnico junto con los datos de usuario.
      description: ''
      parameters: []
      operationId: ''
      responses:
        default:
          description: Default response
      tags:
        - Técnico
  /aquienllamo/tecnicos:
    get:
      summary: Obtener listado completo de técnicos registrados.
      description: ''
      parameters: []
      operationId: ''
      responses:
        default:
          description: Default response
      tags:
        - Administrador
        - Técnico
        - Usuario
  ' /aquienllamo/tecnicos/perfil/{uuid}':
    get:
      summary: Obtener el perfil detallado de un técnico por UUID.
      description: ''
      parameters: []
      operationId: ''
      responses:
        default:
          description: Default response
      tags:
        - Administrador
        - Usuario
        - Técnico
  '/aquienllamo/tecnicos/habilidad/{uuidHabilidad}':
    get:
      summary: Buscar técnicos asociados a una habilidad determinada.
      description: ''
      parameters: []
      operationId: ''
      responses:
        default:
          description: Default response
      tags:
        - Administrador
        - Técnico
        - Usuarios
  '/aquienllamo/tecnicos/especialidad/{uuidEspecialidad}':
    get:
      summary: Buscar técnicos asociados a una especialidad determinada.
      description: ''
      parameters: []
      operationId: ''
      responses:
        default:
          description: Default response
      tags:
        - Administrador
        - Técnico
        - Usuarios
  '/aquienllamo/tecnicos/nombre/{nombre}':
    get:
      summary: Buscar técnicos por nombre.
      description: ''
      parameters: []
      operationId: ''
      responses:
        default:
          description: Default response
      tags:
        - Administrador
        - Técnico
        - Usuario
  '/aquienllamo/tecnicos/rubro/{uuidRubro}':
    get:
      summary: Buscar técnicos pertenecientes a un rubro específico.
      description: ''
      parameters: []
      operationId: ''
      responses:
        default:
          description: Default response
      tags:
        - Administrador
        - Técnico
        - Usuario
  /aquienllamo/tecnicos/buscar:
    get:
      summary: Realizar búsquedas avanzadas de técnicos mediante filtros opcionales.
      description: ''
      parameters:
        - name: nombre
          in: query
          required: false
          schema:
            type: string
        - name: apellido
          in: query
          required: false
          schema:
            type: string
        - name: habilidad
          in: query
          required: false
          schema:
            type: string
        - name: especialidad
          in: query
          required: false
          schema:
            type: string
        - name: fecha
          in: query
          required: false
          schema:
            type: string
      operationId: ''
      responses:
        default:
          description: Default response
      tags:
        - Administrador
        - Usuario
        - Técnico
  '/aquienllamo/tecnicos/actualizar-perfil/{uuid}':
    put:
      summary: Actualizar la información profesional de un técnico.
      description: ''
      parameters: []
      operationId: ''
      responses:
        default:
          description: Default response
      tags:
        - Técnico
  '/aquienllamo/tecnicos/eliminar/{uuid}':
    delete:
      summary: Eliminar un técnico del sistema.
      description: ''
      parameters: []
      operationId: ''
      responses:
        default:
          description: Default response
      tags:
        - 'Administrador  ''/aquienllamo/usuarios/perfil/{uuid}''': null
    get:
      tags:
        - Usuario
      summary: Obtener perfil de usuario por UUID
      description: >
        Permite consultar la información pública de un usuario utilizando su
        UUID. Roles permitidos: administrador, usuario, técnico.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuario encontrado
  '/aquienllamo/usuarios/actualizar/{uuid}':
    patch:
      tags:
        - Usuario
      summary: Actualizar perfil de usuario
      description: >
        Permite modificar parcialmente los datos de un usuario. Usuario
        propietario de la cuenta.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UsuarioUpdateRequest'
      responses:
        '200':
          description: Perfil actualizado correctamente
  '/aquienllamo/usuarios/eliminar/{uuid}':
    delete:
      tags:
        - Usuario
      summary: Eliminar cuenta de usuario
      description: >
        Elimina una cuenta de usuario previa validación de contraseña. Usuario
        propietario de la cuenta.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUsuarioRequest'
      responses:
        '200':
          description: Cuenta eliminada correctamente
  /aquienllamo/usuarios/todos:
    get:
      tags:
        - Usuario
      summary: Listar todos los usuarios
      description: >
        Devuelve el listado completo de usuarios registrados. Roles permitidos:
        administrador.
      responses:
        '200':
          description: Lista de usuarios obtenida correctamente
      parameters: []
  /aquienllamo/usuarios/mi-perfil:
    get:
      tags:
        - Usuario
      summary: Obtener mi perfil
      description: >
        Devuelve los datos del usuario autenticado. Roles permitidos:
        administrador, usuario, técnico.
      responses:
        '200':
          description: Perfil obtenido correctamente
      parameters: []
  '/aquienllamo/usuarios/amonestar/{uuid}':
    patch:
      tags:
        - Usuario
      summary: Amonestar usuario
      description: 'Registra una amonestación sobre un usuario indicando el motivo. '
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: motivo
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuario amonestado correctamente
  '/aquienllamo/usuarios/baja/{uuid}':
    patch:
      tags:
        - Usuario
      summary: Dar de baja usuario
      description: |
        Suspende o da de baja una cuenta de usuario.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuario dado de baja correctamente
  '/aquienllamo/usuarios/usuario/dni/{dni}':
    get:
      tags:
        - Usuario
      summary: Buscar usuario por DNI
      description: |
        Permite localizar un usuario mediante su documento.
      parameters:
        - name: dni
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuario encontrado
  '/aquienllamo/usuarios/usuario/email/{email}':
    get:
      tags:
        - Usuario
      summary: Buscar usuario por email
      description: |
        Permite localizar un usuario mediante su correo electrónico.
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuario encontrado
  '/aquienllamo/usuarios/quitar-suspension/{uuid}':
    patch:
      tags:
        - Usuario
      summary: Quitar suspensión
      description: |
        Elimina la suspensión aplicada a un usuario.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Suspensión removida correctamente
  '/aquienllamo/usuarios/quitar-baja/{uuid}':
    patch:
      tags:
        - Usuario
      summary: Rehabilitar usuario
      description: |
        Revierte la baja de una cuenta y la habilita nuevamente. 
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Baja removida correctamente
    '/presupuestos/chat/{uuidChat}':
      post:
        tags:
          - Presupuestos
        summary: Crear presupuesto
        parameters:
          - name: uuidChat
            in: path
            required: true
            schema:
              type: string
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresupuestoRequest'
        responses:
          '201':
            description: Presupuesto creado
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/PresupuestoResponse'
    '/presupuestos/{uuid}':
      get:
        tags:
          - Presupuestos
        summary: Obtener presupuesto por UUID
        parameters:
          - name: uuid
            in: path
            required: true
            schema:
              type: string
        responses:
          '200':
            description: Presupuesto encontrado
    '/presupuestos/{uuid}/aceptar':
      patch:
        tags:
          - Presupuestos
        summary: Aceptar presupuesto
        parameters:
          - name: uuid
            in: path
            required: true
            schema:
              type: string
        responses:
          '204':
            description: Presupuesto aceptado
    '/presupuestos/{uuid}/rechazar':
      patch:
        tags:
          - Presupuestos
        summary: Rechazar presupuesto
        parameters:
          - name: uuid
            in: path
            required: true
            schema:
              type: string
        responses:
          '204':
            description: Presupuesto rechazado
    '/presupuestos/{uuid}/cancelar':
      patch:
        tags:
          - Presupuestos
        summary: Cancelar presupuesto
        parameters:
          - name: uuid
            in: path
            required: true
            schema:
              type: string
        responses:
          '204':
            description: Presupuesto cancelado
    /presupuestos/todos:
      get:
        tags:
          - Presupuestos
        summary: Listar todos los presupuestos
        responses:
          '200':
            description: Lista de presupuestos
    /presupuestos/buscar:
      get:
        tags:
          - Presupuestos
        summary: Buscar presupuestos por filtros
        parameters:
          - name: nombre
            in: query
            schema:
              type: string
          - name: apellido
            in: query
            schema:
              type: string
          - name: min
            in: query
            schema:
              type: number
          - name: max
            in: query
            schema:
              type: number
          - name: fecha
            in: query
            schema:
              type: string
              format: date
        responses:
          '200':
            description: Resultados encontrados
  '/presupuestos/chat/{uuidChat}':
    post:
      summary: Crear un nuevo presupuesto asociado a un chat existente.
      description: 'Rol: TECNICO'
      parameters: []
      operationId: ''
      responses:
        default:
          description: Default response
      tags:
        - Presupuestos
  '/presupuestos/{uuid}':
    get:
      summary: Obtener la información detallada de un presupuesto mediante su UUID.
      description: 'Rol: ADMINISTRADOR, USUARIO, TECNICO'
      parameters: []
      operationId: ''
      responses:
        default:
          description: Default response
      tags:
        - Presupuestos
  '/presupuestos/{uuid}/aceptar':
    patch:
      summary: Aceptar un presupuesto pendiente.
      description: 'Rol: USUARIO.'
      parameters: []
      operationId: ''
      responses:
        default:
          description: Default response
      tags:
        - Presupuestos
  '/presupuestos/{uuid}/rechazar':
    patch:
      summary: Rechazar un presupuesto pendiente.
      description: ''
      parameters: []
      operationId: ''
      responses:
        default:
          description: Default response
      tags:
        - Presupuestos
  '/presupuestos/{uuid}/cancelar':
    patch:
      summary: >-
        Cancelar un presupuesto existente según las reglas de negocio
        establecidas.
      description: ''
      parameters: []
      operationId: ''
      responses:
        default:
          description: Default response
      tags:
        - Presupuestos
  /presupuestos/todos:
    get:
      summary: Listar todos los presupuestos registrados en el sistema.
      description: ''
      parameters: []
      operationId: ''
      responses:
        default:
          description: Default response
      tags:
        - Presupuestos
  /presupuestos/buscar:
    get:
      summary: >-
        Buscar presupuestos aplicando filtros opcionales como nombre, apellido,
        rango de precios o fecha.
      description: ''
      parameters: []
      operationId: ''
      responses:
        default:
