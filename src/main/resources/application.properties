spring.application.name=aquienllamo
# CONFIGURACIÓN BDD
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION_MS}

# PayU Latam
payu.api-key=${PAYU_API_KEY}
payu.api-login=${PAYU_API_LOGIN}
payu.account-id=${PAYU_ACCOUNT_ID}
payu.merchant-id=${PAYU_MERCHANT_ID}
payu.url=${PAYU_URL}

# ABSTRACT PHONE VALIDATION
abstract.api.key=${ABSTRACT_API_KEY}
abstract.api.url=${ABSTRACT_API_URL}

#GMAIL APP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true